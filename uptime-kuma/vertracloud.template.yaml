id: uptime-kuma
version: 1.0.0
name: { pt-br: Uptime Kuma, en: Uptime Kuma, es: Uptime Kuma }
description:
  pt-br: Monitoramento de sites e serviços com alertas e página de status. Seus dados no seu app.
  en: Monitor sites and services with alerts and a status page. Your data on your app.
  es: Monitoreo de sitios y servicios con alertas y página de estado. Tus datos en tu app.
category: monitoring
tags: [monitoring, uptime, status-page, alerts]
icon: icon.svg
links:
  website: https://uptime.kuma.pet
  docs: https://github.com/louislam/uptime-kuma/wiki
  source: https://github.com/louislam/uptime-kuma
  license: https://github.com/louislam/uptime-kuma/blob/master/LICENSE

# Generated once and shown once; docker/vertra-start.cjs creates the account at deploy.
secrets: [admin_password]

services:
  app:
    source:
      type: image
      image: "docker.io/louislam/uptime-kuma:2-slim@sha256:3e0ae13fa92d0a1108b7e4133eaa25b2bc4e26d2f5d8691a5cb01ee1fe5c95f1"
      context: docker
    port: 3001
    ram: { min: 512, recommended: 512 }
    web: required
    env:
      UPTIME_KUMA_DB_TYPE: sqlite   # without it Kuma 2.x opens the "Setup Database" wizard
      DATA_DIR: /app/data/
      KUMA_ADMIN_PASSWORD: "{{secrets.admin_password}}"   # only used on the first start (no user yet); Kuma never receives it
    healthcheck: { path: /api/entry-page, timeout: 120 }   # 200 JSON; passes only after the admin exists
    deploy:
      zero_downtime: { default: "off", locked: true }   # each copy would run every monitor: duplicate heartbeats and alerts
      auto_rollback: { default: true }
      rollback: { with_data: required }   # Kuma migrates the database on upgrade

permissions:
  code: { view: true, edit: false }
  ram: { change: true, below_min: false, above_max: true }

outputs:
  - { label: { pt-br: Endereço, en: Address, es: Dirección }, value: "{{app.url}}" }
  - { label: { pt-br: Usuário, en: User, es: Usuario }, value: admin }
  - label: { pt-br: Senha, en: Password, es: Contraseña }
    value: "{{secrets.admin_password}}"
    secret: true
    once: true
  - label: { pt-br: Próximo passo, en: Next step, es: Siguiente paso }
    value:
      pt-br: "Abra o endereço e entre com o usuário e a senha acima: o administrador já foi criado no deploy (a senha é mostrada uma vez; você pode trocá-la depois em Configurações > Perfil)."
      en: "Open the address and sign in with the user and password above: the administrator was already created at deploy time (the password is shown once; you can change it later in Settings > Profile)."
      es: "Abre la dirección e inicia sesión con el usuario y la contraseña de arriba: el administrador ya se creó en el deploy (la contraseña se muestra una vez; puedes cambiarla después en Configuración > Perfil)."
