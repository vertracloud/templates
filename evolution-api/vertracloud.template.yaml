id: evolution-api
version: 1.0.0
name: { pt-br: Evolution API, en: Evolution API, es: Evolution API }
description:
  pt-br: API de WhatsApp com instâncias, webhooks e integrações. Postgres incluso.
  en: WhatsApp API with instances, webhooks and integrations. Postgres included.
  es: API de WhatsApp con instancias, webhooks e integraciones. Postgres incluido.
category: apis
tags: [whatsapp, api, webhooks]
icon: icon.svg
links:
  website: https://evolution-api.com
  docs: https://doc.evolution-api.com
  source: https://github.com/evolution-foundation/evolution-api
  license: https://github.com/evolution-foundation/evolution-api/blob/main/LICENSE

secrets: [api_key]

inputs:
  - id: cache
    type: select
    label: { pt-br: "Cache da Evolution API", en: "Evolution API cache", es: "Caché de Evolution API" }
    help:
      pt-br: "Local funciona sem Redis. Redis gerenciado guarda o cache fora do processo (usa 512 MB a mais do plano)."
    default: local
    options:
      - value: local
        label: { pt-br: "Cache local (sem Redis)", en: "Local cache (no Redis)", es: "Caché local (sin Redis)" }
        sets:
          services: { cache: "off" }
          env: { app: { CACHE_REDIS_ENABLED: "false", CACHE_LOCAL_ENABLED: "true" } }
      - value: redis
        label: { pt-br: "Redis gerenciado", en: "Managed Redis", es: "Redis administrado" }
        sets:
          services: { cache: "on" }
          env: { app: { CACHE_REDIS_ENABLED: "true", CACHE_LOCAL_ENABLED: "false", CACHE_REDIS_SAVE_INSTANCES: "true" } }

services:
  app:
    source: { type: image, image: "docker.io/evoapicloud/evolution-api@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339", context: docker }
    port: 8080
    ram: { min: 512, recommended: 1024 }   # grows with the number of instances
    web: required
    env:
      SERVER_URL: "{{app.url}}"
      AUTHENTICATION_API_KEY: "{{secrets.api_key}}"   # the image .env ships a public default key: always override it
      TELEMETRY_ENABLED: "false"
      # Prisma only supports client certificates with a PKCS#12 identity: sslidentity=<client.p12>; sslcert is the server CA; sslaccept=strict checks chain and host.
      DATABASE_CONNECTION_URI: "postgresql://{{services.db.user}}:{{services.db.password}}@{{services.db.host}}:{{services.db.port}}/{{services.db.database}}?schema=evolution_api&sslmode=require&sslaccept=strict&sslcert={{services.db.ssl.ca_path}}&sslidentity={{services.db.ssl.p12_path}}"
      # Redis (cache=redis only): node-redis takes no client certificate, so the image preloads vertra-tls-client-cert.cjs, which adds it to TLS connections to the Redis host only. Without Redis these resolve to empty and it does nothing.
      CACHE_REDIS_URI: "rediss://{{services.cache.user}}:{{services.cache.password}}@{{services.cache.host}}:{{services.cache.port}}/6"
      NODE_EXTRA_CA_CERTS: "{{services.cache.ssl.ca_path}}"
      VERTRA_TLS_CLIENT_HOST: "{{services.cache.host}}"
      VERTRA_TLS_CLIENT_CERT: "{{services.cache.ssl.cert_path}}"
      VERTRA_TLS_CLIENT_KEY: "{{services.cache.ssl.key_path}}"
    healthcheck: { path: /, timeout: 120 }   # 200 welcome message; /healthz does not exist
    deploy:
      zero_downtime: { default: "off", locked: true }   # a WhatsApp session with two sockets is dropped by the server
      auto_rollback: { default: true }
      rollback: { with_data: required }   # the entrypoint runs `prisma migrate deploy` on every start
  db:
    database: postgres
    ram: { min: 1024, recommended: 1024 }
  cache:
    database: redis
    ram: { min: 512, recommended: 512 }
    when: { input: cache, equals: redis }

permissions:
  ram: { change: true, below_min: false, above_max: true }

outputs:
  - { label: { pt-br: Painel, en: Manager, es: Panel }, value: "{{app.url}}/manager" }
  - { label: { pt-br: API key global, en: Global API key, es: API key global }, value: "{{secrets.api_key}}", secret: true, once: true }
  - label: { pt-br: Próximo passo, en: Next step, es: Siguiente paso }
    value:
      pt-br: "Abra o painel, entre com a API key, crie uma instância e leia o QR code no WhatsApp."
      en: "Open the manager, sign in with the API key, create an instance and scan the QR code in WhatsApp."
      es: "Abre el panel, entra con la API key, crea una instancia y escanea el QR en WhatsApp."
